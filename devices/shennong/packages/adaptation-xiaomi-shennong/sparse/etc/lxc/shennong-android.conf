# Keep upstream Android container wiring and add the device's display profile.
lxc.include = /var/lib/lxc/android/config
# The stock-compatible display kernel has no SysV IPC or user namespaces.
# Android HAL services use Binder; retain the host IPC/user context while
# preserving the container's separate PID and mount namespaces.
lxc.namespace.keep = ipc user
