# Keep upstream Android container wiring and add the device's display profile.
lxc.include = /var/lib/lxc/android/config
# This device and its Android 14 GSI are 64-bit only. The generic container
# defaults to armhf, whose 32-bit personality is rejected by the stock kernel.
lxc.arch = aarch64
# Send startup errors through the native syslog socket into journald.
lxc.log.syslog = daemon
# Stock NICM and its Radio clients must see the host's IPA/RMNET devices and
# TIPC transport. Match upstream's shared network namespace; the NICM adapter
# selects Linux routing, while NetworkManager owns host addresses and routes.
lxc.net.0.type = none
# Linux owns module loading and the hardware initialization order. The stock
# vendor module loader starts hundreds of probes in parallel; HAL services
# must use the modules prepared by the host instead of loading a second set.
lxc.cap.drop = sys_module sys_time sys_boot
# The stock-compatible display kernel has no SysV IPC or user namespaces.
# Android HAL services use Binder; retain the host IPC/user context while
# preserving the container's separate PID and mount namespaces.
lxc.namespace.keep = ipc user net
# The dedicated root already carries its APEX subtree into the container.
# Binding /apex again stacks identical versioned mounts; apexd rejects the
# duplicate entries in MountedApexDatabase. Keep one inherited APEX tree.
lxc.mount.entry =
lxc.mount.entry = tmpfs dev tmpfs nosuid 0 0
lxc.mount.entry = /dev/null dev/null none bind,create=file 0 0
lxc.mount.entry = /dev/zero dev/zero none bind,create=file 0 0
lxc.mount.entry = /dev/random dev/random none bind,create=file 0 0
lxc.mount.entry = /dev/urandom dev/urandom none bind,create=file 0 0
lxc.mount.entry = /dev/__properties__ dev/__properties__ none bind,create=dir 0 0
lxc.mount.entry = /dev/binderfs dev/binderfs none bind,create=dir 0 0
lxc.mount.entry = /dev/socket dev/socket none bind,create=dir 0 0
lxc.mount.entry = proc proc proc nodev,noexec,nosuid 0 0
lxc.mount.entry = sys sys sysfs nodev,noexec,nosuid 0 0
lxc.mount.entry = /android/data data none bind 0 0
lxc.mount.entry = /mnt mnt none rbind 0 0
lxc.mount.entry = /odm odm none bind,optional 0 0
lxc.mount.entry = /vendor_dlkm vendor_dlkm none bind,optional 0 0
