[Unit]
# This stage loads the captured btpower/bt_fm_slim transport modules.
Wants=shennong-audio.service
After=shennong-audio.service

[Service]
ExecStartPre=/usr/bin/udevadm settle --timeout=10
# The stock HIDL controller reports its factory BD_ADDR through HCI.
# No legacy property/file-based address injection is needed on this device.
ExecStartPost=
