[Unit]
Requires=android-mount.service
After=android-mount.service

[Service]
# lxc-android installs a Type=notify unit whose ExecStart waits for Android
# readiness. Keep that upstream notifier and change only its container config.
ExecStartPre=
ExecStartPre=/usr/libexec/shennong-android-start
# This layout uses private captured images, not the host's super partition.
# Keep generic power-control and dynamic-partition teardown out of this host.
ExecStop=
ExecStop=-/usr/bin/lxc-stop -n android -k
