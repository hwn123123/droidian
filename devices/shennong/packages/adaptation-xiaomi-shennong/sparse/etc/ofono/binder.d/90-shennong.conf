[Settings]
# Stock API 34 radio services use stable AIDL on the system Binder device.
Device = /dev/binder
InterfaceType = aidl
ExpectSlots = slot1,slot2

[slot1]
path = /ril_0
slot = 0
# Stock OS3.0.309.0 CN default LTE/NR display thresholds, in real dBm.
# Optional binder-plugin policy; RSSI/RSCP and unreported values keep native handling.
signalStrengthRsrpThresholds = -125,-115,-110,-105

[slot2]
path = /ril_1
slot = 1
signalStrengthRsrpThresholds = -125,-115,-110,-105
