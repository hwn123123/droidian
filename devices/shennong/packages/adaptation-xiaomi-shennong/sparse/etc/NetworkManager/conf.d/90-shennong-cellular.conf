# This Droidian build contains both direct-ofono and ModemManager backends.
# Use the standard ModemManager/ofono2mm path that GNOME Settings controls.
# The direct-ofono pseudo devices have no slash; MM uses /ril_0 and /ril_1.
[device-shennong-ofono-legacy]
match-device=interface-name:ril_0;interface-name:ril_1
managed=0
